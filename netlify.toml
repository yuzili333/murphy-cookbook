[build]
command = "pnpm build:netlify"
publish = "apps/frontend/dist"

[build.environment]
NODE_VERSION = "20.19.0"
VITE_API_BASE_URL = "/.netlify/functions/api/v1"

[functions]
directory = "apps/server/netlify/functions"
node_bundler = "esbuild"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
